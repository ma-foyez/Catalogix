; Install at /etc/supervisor/conf.d/catalogix.conf.
; Adjust /var/www/catalogix, /usr/bin/php and www-data for your server.
; Workers start at boot and restart after crashes. Each queue has its own capacity.
[program:catalogix-discovery]
command=/usr/bin/php /var/www/catalogix/artisan queue:work --queue=discovery --sleep=1 --timeout=960 --tries=0 --memory=256 --max-time=3600
directory=/var/www/catalogix
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=1020
redirect_stderr=true
stdout_logfile=/var/www/catalogix/storage/logs/worker-discovery-%(process_num)02d.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

